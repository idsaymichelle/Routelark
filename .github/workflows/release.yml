name: Release

# Push a tag like v1.0.0: the workflow tests, builds and attaches routelark.html to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: gh release create "$GITHUB_REF_NAME" dist/routelark.html --title "Routelark $GITHUB_REF_NAME" --notes "Download routelark.html, open it in Chrome, Edge or Safari and drag the Routelark button to your bookmarks bar."
        env:
          GH_TOKEN: ${{ github.token }}
